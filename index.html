<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solat BSB">
<title>Solat BSB</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0b1120;
  --bg2:      #111827;
  --card:     #161f30;
  --border:   #1e2d45;
  --gold:     #d4a843;
  --gold2:    #f0cc7a;
  --teal:     #1a7a6e;
  --teal2:    #25b09e;
  --text:     #e8e0d0;
  --dim:      #6b7fa0;
  --next-bg:  #0f2a24;
  --next-bdr: #1c4f43;
  --ring:     #e05c2a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  background-image:
    radial-gradient(ellipse 80% 40% at 50% -10%, rgba(26,122,110,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 60% 30% at 80% 110%, rgba(212,168,67,0.08) 0%, transparent 60%);
}

/* ── Header ── */
.header{
  width:100%;
  max-width:480px;
  padding:48px 24px 0;
  text-align:center;
}
.crescent{
  font-size:2.2rem;
  margin-bottom:8px;
  display:block;
  filter:drop-shadow(0 0 12px rgba(212,168,67,0.5));
}
.header h1{
  font-family:'Amiri',serif;
  font-size:2rem;
  color:var(--gold2);
  letter-spacing:0.03em;
}
.header .loc{
  font-size:0.75rem;
  color:var(--dim);
  letter-spacing:0.14em;
  text-transform:uppercase;
  margin-top:4px;
}

/* ── Clock card ── */
.clock-card{
  width:calc(100% - 32px);
  max-width:480px;
  margin:24px 16px 0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px 24px;
  position:relative;
  overflow:hidden;
}
.clock-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.clock-time{
  font-family:'Amiri',serif;
  font-size:clamp(3rem,14vw,4rem);
  color:var(--gold2);
  line-height:1;
  text-align:center;
}
.clock-date{
  text-align:center;
  font-size:0.8rem;
  color:var(--dim);
  margin-top:4px;
  letter-spacing:0.06em;
}
.next-pill{
  margin-top:14px;
  background:var(--next-bg);
  border:1px solid var(--next-bdr);
  border-radius:40px;
  padding:8px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:0.82rem;
}
.next-label{color:var(--dim);white-space:nowrap}
.next-name{color:var(--teal2);font-weight:500;flex:1}
.next-countdown{
  font-family:'Amiri',serif;
  font-size:1rem;
  color:var(--gold);
  white-space:nowrap;
}

/* ── Prayer list ── */
.prayers{
  width:calc(100% - 32px);
  max-width:480px;
  margin:20px 16px 0;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.prayer-row{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:14px;
  transition:border-color 0.25s, background 0.25s;
  position:relative;
  overflow:hidden;
}
.prayer-row.is-next{
  background:var(--next-bg);
  border-color:var(--next-bdr);
}
.prayer-row.is-next::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;width:3px;
  background:var(--teal2);
  border-radius:3px 0 0 3px;
}
.prayer-row.is-past{opacity:0.45}
.prayer-row.ringing{
  border-color:var(--ring) !important;
  animation:ringBorder 0.8s ease-in-out infinite;
}
@keyframes ringBorder{
  0%,100%{box-shadow:0 0 0 0 rgba(224,92,42,0.4)}
  50%{box-shadow:0 0 0 6px rgba(224,92,42,0)}
}
.p-icon{font-size:1.6rem;width:36px;text-align:center;flex-shrink:0}
.p-info{flex:1;min-width:0}
.p-name{font-weight:500;font-size:0.95rem;color:var(--text)}
.p-arabic{font-family:'Amiri',serif;font-size:0.8rem;color:var(--dim);margin-top:1px}
.p-offset{font-size:0.7rem;color:var(--teal2);margin-top:2px}
.p-time{
  font-family:'Amiri',serif;
  font-size:1.45rem;
  color:var(--gold);
  text-align:right;
  white-space:nowrap;
}
.is-next .p-time{color:var(--gold2)}

/* toggle */
.tog{position:relative;width:42px;height:23px;cursor:pointer;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tog-track{position:absolute;inset:0;background:var(--border);border-radius:12px;transition:background .2s}
.tog input:checked+.tog-track{background:var(--teal)}
.tog-thumb{position:absolute;top:3px;left:3px;width:17px;height:17px;background:#fff;border-radius:50%;transition:transform .2s}
.tog input:checked~.tog-thumb{transform:translateX(19px)}

/* ── Offset settings ── */
.settings{
  width:calc(100% - 32px);
  max-width:480px;
  margin:16px 16px 0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 18px;
}
.settings-title{
  font-size:0.72rem;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--dim);
  margin-bottom:12px;
}
.offset-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}
.offset-row:last-child{margin-bottom:0}
.offset-label{font-size:0.88rem;flex:1}
.offset-note{font-size:0.72rem;color:var(--teal2)}
.offset-ctrl{
  display:flex;
  align-items:center;
  gap:6px;
}
.offset-btn{
  background:var(--bg2);
  border:1px solid var(--border);
  color:var(--text);
  width:30px;height:30px;
  border-radius:8px;
  font-size:1.1rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s;
}
.offset-btn:hover{border-color:var(--gold)}
.offset-val{
  font-family:'Amiri',serif;
  font-size:1rem;
  color:var(--gold);
  width:48px;
  text-align:center;
}

/* ── Ring modal ── */
.modal{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,0.85);
  z-index:200;
  align-items:center;justify-content:center;
  padding:24px;
}
.modal.show{display:flex}
.modal-box{
  background:var(--bg2);
  border:1px solid var(--ring);
  border-radius:28px;
  padding:40px 28px;
  text-align:center;
  max-width:300px;width:100%;
  animation:popIn .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 0 60px rgba(224,92,42,0.2);
}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-icon{font-size:3.5rem;animation:sway .7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.modal-prayer{
  font-family:'Amiri',serif;
  font-size:1.9rem;
  color:var(--gold2);
  margin:12px 0 2px;
}
.modal-arabic{font-family:'Amiri',serif;font-size:1rem;color:var(--dim);margin-bottom:4px}
.modal-time{font-size:0.9rem;color:var(--dim);margin-bottom:24px}
.btn-dismiss{
  width:100%;
  padding:13px;
  background:var(--ring);
  color:#fff;
  border:none;
  border-radius:14px;
  font-family:'DM Sans',sans-serif;
  font-size:1rem;
  font-weight:500;
  cursor:pointer;
  transition:opacity .2s;
}
.btn-dismiss:hover{opacity:.85}

/* ── Install banner ── */
.install-bar{
  width:calc(100% - 32px);
  max-width:480px;
  margin:14px 16px 32px;
  background:rgba(26,122,110,0.12);
  border:1px solid rgba(37,176,158,0.25);
  border-radius:12px;
  padding:12px 16px;
  font-size:0.8rem;
  color:var(--teal2);
  text-align:center;
  line-height:1.5;
}
.install-bar strong{display:block;margin-bottom:2px;font-size:0.85rem}

.footer{
  margin:0 16px 32px;
  font-size:0.72rem;
  color:var(--dim);
  text-align:center;
  opacity:0.6;
}
</style>
</head>
<body>

<div class="header">
  <span class="crescent">☪️</span>
  <h1>Solat BSB</h1>
  <p class="loc">Bandar Seri Begawan · Brunei</p>
</div>

<div class="clock-card">
  <div class="clock-time" id="clockTime">00:00:00</div>
  <div class="clock-date" id="clockDate"></div>
  <div class="next-pill">
    <span class="next-label">Next</span>
    <span class="next-name" id="nextName">—</span>
    <span class="next-countdown" id="nextCountdown">—</span>
  </div>
</div>

<div class="prayers" id="prayerList"></div>

<div class="settings">
  <div class="settings-title">⚙ Time Corrections</div>
  <div class="offset-row">
    <div class="offset-label">
      Fajr (Subuh)
      <div class="offset-note" id="fajrNote"></div>
    </div>
    <div class="offset-ctrl">
      <button class="offset-btn" onclick="changeOffset('fajr',-1)">−</button>
      <div class="offset-val" id="fajrVal"></div>
      <button class="offset-btn" onclick="changeOffset('fajr',+1)">+</button>
    </div>
  </div>
  <div class="offset-row">
    <div class="offset-label">
      Isya'
      <div class="offset-note" id="isyaNote"></div>
    </div>
    <div class="offset-ctrl">
      <button class="offset-btn" onclick="changeOffset('isya',-1)">−</button>
      <div class="offset-val" id="isyaVal"></div>
      <button class="offset-btn" onclick="changeOffset('isya',+1)">+</button>
    </div>
  </div>
</div>

<div class="install-bar">
  <strong>📲 Install as App</strong>
  In your browser: tap <strong>Share → Add to Home Screen</strong> (iOS) or the install icon in the address bar (Android Chrome)
</div>

<div class="footer">Keep this page open for alarms to ring · Calculated via JAKIM method</div>

<!-- Ring modal -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-icon" id="modalIcon">🕌</div>
    <div class="modal-prayer" id="modalPrayer"></div>
    <div class="modal-arabic" id="modalArabic"></div>
    <div class="modal-time" id="modalTime"></div>
    <button class="btn-dismiss" onclick="dismiss()">Dismiss</button>
  </div>
</div>

<script>
// ── Prayer data ──────────────────────────────────────────────
const PRAYERS = [
  { key:'fajr',    name:'Fajr',    malay:'Subuh',   arabic:'الفجر',  icon:'🌅' },
  { key:'dhuhr',   name:'Dhuhr',   malay:'Zohor',   arabic:'الظهر',  icon:'☀️' },
  { key:'asr',     name:'Asr',     malay:'Asar',    arabic:'العصر',  icon:'🌤️' },
  { key:'maghrib', name:'Maghrib', malay:'Maghrib', arabic:'المغرب', icon:'🌇' },
  { key:'isha',    name:'Isha\'',  malay:'Isya\'',  arabic:'العشاء', icon:'🌙' },
];

// Brunei BSB coords
const LAT = 4.9031;
const LNG = 114.9398;

// Offsets in minutes (user-adjustable, saved to localStorage)
let offsets = { fajr: -9, isya: +5 };
try {
  const saved = JSON.parse(localStorage.getItem('prayerOffsets') || '{}');
  if (saved.fajr !== undefined) offsets.fajr = saved.fajr;
  if (saved.isya !== undefined) offsets.isya = saved.isya;
} catch {}

let enabled = { fajr:true, dhuhr:true, asr:true, maghrib:true, isha:true };
try {
  const e = JSON.parse(localStorage.getItem('prayerEnabled') || '{}');
  Object.assign(enabled, e);
} catch {}

let ringingKey = null;
let audioCtx = null;
let chimeTimer = null;

// ── JAKIM Prayer Time Calculation ────────────────────────────
// Based on Muslim World League with JAKIM's Fajr 20°, Isha 18°
function toRad(d){ return d * Math.PI / 180; }
function toDeg(r){ return r * 180 / Math.PI; }

function calcPrayerTimes(date) {
  const year  = date.getFullYear();
  const month = date.getMonth() + 1;
  const day   = date.getDate();

  // Julian date
  let JD = 367*year - Math.floor(7*(year+Math.floor((month+9)/12))/4)
           + Math.floor(275*month/9) + day + 1721013.5;

  const D = JD - 2451545.0;
  const g = toRad((357.529 + 0.98560028 * D) % 360);
  const q = (280.459 + 0.98564736 * D) % 360;
  const L = toRad((q + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) % 360);
  const e = toRad(23.439 - 0.00000036*D);
  const RA = toDeg(Math.atan2(Math.cos(e)*Math.sin(L), Math.cos(L))) / 15;
  const dec = Math.asin(Math.sin(e)*Math.sin(L));
  const EqT = q/15 - ((RA % 24 + 24) % 24);

  const lat = toRad(LAT);
  const lng = LNG;
  const tz  = 8; // Brunei UTC+8

  function hourAngle(angle) {
    const cosH = (Math.sin(toRad(angle)) - Math.sin(lat)*Math.sin(dec))
                 / (Math.cos(lat)*Math.cos(dec));
    if (cosH < -1) return 0;
    if (cosH >  1) return 0;
    return toDeg(Math.acos(cosH)) / 15;
  }

  const transit = 12 + tz - lng/15 - EqT;

  // JAKIM: Fajr 20°, Isha 18°
  const fajrRaw    = transit - hourAngle(-20);
  const sunriseRaw = transit - hourAngle(-0.8333);
  const dhuhrRaw   = transit;
  // Asr (Shafi'i shadow factor 1)
  const cosA = Math.sin(Math.atan(1/( 1 + Math.tan(Math.abs(dec - lat)) )));
  const asrHA = toDeg(Math.acos((cosA - Math.sin(lat)*Math.sin(dec)) / (Math.cos(lat)*Math.cos(dec)))) / 15;
  const asrRaw     = transit + asrHA;
  const maghribRaw = transit + hourAngle(-0.8333);
  const ishaRaw    = transit + hourAngle(-18);

  function toHHMM(h) {
    const total = Math.round(h * 60);
    const hh = Math.floor(total / 60) % 24;
    const mm = total % 60;
    return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  }

  return {
    fajr:    toHHMM(fajrRaw),
    dhuhr:   toHHMM(dhuhrRaw),
    asr:     toHHMM(asrRaw),
    maghrib: toHHMM(maghribRaw),
    isha:    toHHMM(ishaRaw),
  };
}

function applyOffsets(times) {
  function shift(hhmm, mins) {
    const [h,m] = hhmm.split(':').map(Number);
    const total = h*60 + m + mins;
    const t2 = ((total % 1440) + 1440) % 1440;
    return `${String(Math.floor(t2/60)).padStart(2,'0')}:${String(t2%60).padStart(2,'0')}`;
  }
  return {
    fajr:    shift(times.fajr,    offsets.fajr),
    dhuhr:   times.dhuhr,
    asr:     times.asr,
    maghrib: times.maghrib,
    isha:    shift(times.isha,    offsets.isya),
  };
}

function fmt12(hhmm) {
  const [h,m] = hhmm.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,'0')} ${ap}`;
}

// ── Render ───────────────────────────────────────────────────
let todayTimes = {};
let adjustedTimes = {};

function computeTimes() {
  todayTimes   = calcPrayerTimes(new Date());
  adjustedTimes = applyOffsets(todayTimes);
}

function nowMinutes() {
  const n = new Date();
  return n.getHours()*60 + n.getMinutes();
}

function timeToMins(hhmm) {
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}

function renderPrayers() {
  const list = document.getElementById('prayerList');
  const nowM = nowMinutes();

  // Find next prayer
  let nextKey = null;
  let nextMins = Infinity;
  PRAYERS.forEach(p => {
    const t = timeToMins(adjustedTimes[p.key]);
    const diff = (t - nowM + 1440) % 1440;
    if (diff > 0 && diff < nextMins) { nextMins = diff; nextKey = p.key; }
  });

  list.innerHTML = PRAYERS.map(p => {
    const adj = adjustedTimes[p.key];
    const raw = todayTimes[p.key];
    const isNext = p.key === nextKey;
    const isPast = !isNext && timeToMins(adj) < nowM;
    const isRing = p.key === ringingKey;

    let offsetNote = '';
    if (p.key === 'fajr') {
      const sign = offsets.fajr >= 0 ? '+' : '';
      offsetNote = `Calculated: ${fmt12(raw)} · Adjusted: ${sign}${offsets.fajr} min`;
    } else if (p.key === 'isha') {
      const sign = offsets.isya >= 0 ? '+' : '';
      offsetNote = `Calculated: ${fmt12(raw)} · Adjusted: ${sign}${offsets.isya} min`;
    }

    return `
    <div class="prayer-row ${isNext?'is-next':''} ${isPast?'is-past':''} ${isRing?'ringing':''}">
      <div class="p-icon">${p.icon}</div>
      <div class="p-info">
        <div class="p-name">${p.malay} <span style="color:var(--dim);font-size:0.8em">${p.name}</span></div>
        <div class="p-arabic">${p.arabic}</div>
        ${offsetNote ? `<div class="p-offset">${offsetNote}</div>` : ''}
      </div>
      <label class="tog" title="${enabled[p.key]?'Alarm on':'Alarm off'}">
        <input type="checkbox" ${enabled[p.key]?'checked':''} onchange="togglePrayer('${p.key}',this.checked)">
        <div class="tog-track"></div>
        <div class="tog-thumb"></div>
      </label>
      <div class="p-time">${fmt12(adj)}</div>
    </div>`;
  }).join('');

  // Next pill
  if (nextKey) {
    const p = PRAYERS.find(x => x.key === nextKey);
    const h = Math.floor(nextMins/60);
    const m = nextMins%60;
    const countStr = h > 0 ? `${h}h ${m}m` : `${m}m`;
    document.getElementById('nextName').textContent = `${p.icon} ${p.malay}`;
    document.getElementById('nextCountdown').textContent = `in ${countStr}`;
  } else {
    document.getElementById('nextName').textContent = 'All done for today';
    document.getElementById('nextCountdown').textContent = '';
  }
}

function renderOffsets() {
  const fSign = offsets.fajr >= 0 ? '+' : '';
  const iSign = offsets.isya >= 0 ? '+' : '';
  document.getElementById('fajrVal').textContent = `${fSign}${offsets.fajr} min`;
  document.getElementById('isyaVal').textContent = `${iSign}${offsets.isya} min`;
  document.getElementById('fajrNote').textContent =
    `Calculated: ${fmt12(todayTimes.fajr)} → ${fmt12(adjustedTimes.fajr)}`;
  document.getElementById('isyaNote').textContent =
    `Calculated: ${fmt12(todayTimes.isha)} → ${fmt12(adjustedTimes.isha)}`;
}

// ── Clock ────────────────────────────────────────────────────
const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let lastCheckedMinute = -1;
let lastCheckedDate   = '';

function tick() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clockTime').textContent = `${h}:${m}:${s}`;
  document.getElementById('clockDate').textContent =
    `${DAYS[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;

  // Recalculate at midnight
  const dateStr = now.toDateString();
  if (dateStr !== lastCheckedDate) {
    lastCheckedDate = dateStr;
    computeTimes();
    renderPrayers();
    renderOffsets();
  }

  // Check alarms every new minute
  const minNow = now.getHours()*60 + now.getMinutes();
  if (s === '00' || (minNow !== lastCheckedMinute)) {
    lastCheckedMinute = minNow;
    renderPrayers(); // refresh next/past highlights
    if (ringingKey === null) {
      PRAYERS.forEach(p => {
        if (!enabled[p.key]) return;
        const t = adjustedTimes[p.key];
        if (!t) return;
        const [ph, pm] = t.split(':').map(Number);
        if (ph === now.getHours() && pm === now.getMinutes() && now.getSeconds() < 30) {
          triggerAlarm(p);
        }
      });
    }
  }
}

// ── Alarm ────────────────────────────────────────────────────
function triggerAlarm(prayer) {
  ringingKey = prayer.key;
  document.getElementById('modalIcon').textContent   = prayer.icon;
  document.getElementById('modalPrayer').textContent  = prayer.malay;
  document.getElementById('modalArabic').textContent  = prayer.arabic;
  document.getElementById('modalTime').textContent    =
    `${fmt12(adjustedTimes[prayer.key])} · Prayer time`;
  document.getElementById('modal').classList.add('show');
  renderPrayers();
  playChime();
}

function dismiss() {
  ringingKey = null;
  document.getElementById('modal').classList.remove('show');
  stopChime();
  renderPrayers();
}

function playChime() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    scheduleChime();
  } catch(e) {}
}

function scheduleChime() {
  if (!audioCtx) return;
  // Gentle ascending chime: C-E-G-C (octave)
  const notes = [523.25, 659.25, 783.99, 1046.50];
  let t = audioCtx.currentTime;
  const loop = () => {
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const env = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      env.gain.setValueAtTime(0, t + i*0.4);
      env.gain.linearRampToValueAtTime(0.22, t + i*0.4 + 0.06);
      env.gain.exponentialRampToValueAtTime(0.001, t + i*0.4 + 0.8);
      osc.connect(env);
      env.connect(audioCtx.destination);
      osc.start(t + i*0.4);
      osc.stop(t + i*0.4 + 0.9);
    });
    t += notes.length*0.4 + 1.2;
  };
  for (let i = 0; i < 30; i++) loop(); // ~3 min of chimes
}

function stopChime() {
  if (audioCtx) {
    try { audioCtx.close(); } catch(e) {}
    audioCtx = null;
  }
}

// ── Controls ─────────────────────────────────────────────────
function togglePrayer(key, val) {
  enabled[key] = val;
  try { localStorage.setItem('prayerEnabled', JSON.stringify(enabled)); } catch {}
  renderPrayers();
}

function changeOffset(which, delta) {
  if (which === 'fajr') offsets.fajr = Math.max(-30, Math.min(30, offsets.fajr + delta));
  else                  offsets.isya = Math.max(-30, Math.min(30, offsets.isya + delta));
  try { localStorage.setItem('prayerOffsets', JSON.stringify(offsets)); } catch {}
  adjustedTimes = applyOffsets(todayTimes);
  renderOffsets();
  renderPrayers();
}

// ── Init ─────────────────────────────────────────────────────
computeTimes();
renderPrayers();
renderOffsets();
setInterval(tick, 1000);
tick();
</script>
